<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2B HUB — Premium Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --black: #f0f6ff;
  --card: #ffffff;
  --white: #0a1a3a;
  --white2: #1a3060;
  --silver: #4a6090;
  --accent: #1565c0;
  --accent2: #1e88e5;
  --border: rgba(21,101,192,0.18);
  --nav-bg: rgba(255,255,255,0.92);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--black);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* CURSOR SYSTEM */
.cursor {
  position: fixed; width: 12px; height: 12px;
  background: var(--accent); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transform: translate(-50%, -50%);
  mix-blend-mode: multiply;
}
.cursor-ring {
  position: fixed; width: 40px; height: 40px;
  border: 1.5px solid var(--accent); border-radius: 50%;
  pointer-events: none; z-index: 99998;
  transform: translate(-50%, -50%);
  opacity: 0.5;
}

/* NAVIGATION & HAMBURGER */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 0 5%; display: flex; align-items: center;
  justify-content: space-between; height: 70px;
  background: var(--nav-bg); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px;
  letter-spacing: 4px; color: var(--accent); text-decoration: none;
}

/* HAMBURGER ICON */
.menu-btn {
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer; z-index: 1100; padding: 10px;
}
.menu-btn span {
  width: 30px; height: 2px; background: var(--accent);
  transition: 0.3s;
}

/* SIDE MENU */
.side-menu {
  position: fixed; top: 0; right: -100%; width: 300px; height: 100vh;
  background: var(--white); color: white; z-index: 1050;
  display: flex; flex-direction: column; padding: 100px 40px;
  transition: 0.5s cubic-bezier(0.77,0.2,0.05,1.0);
  box-shadow: -10px 0 30px rgba(0,0,0,0.1);
}
.side-menu.active { right: 0; }
.side-menu a {
  color: #fff; text-decoration: none; font-family: 'Bebas Neue';
  font-size: 40px; margin-bottom: 20px; transition: 0.3s;
  cursor: pointer;
}
.side-menu a:hover { color: var(--accent2); padding-left: 10px; }

/* HERO SECTION */
.hero {
  min-height: 60vh; display: flex; align-items: center;
  padding: 100px 5% 0;
  background: linear-gradient(135deg, #e8f1ff 0%, #dceeff 100%);
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(60px, 10vw, 120px); line-height: 0.9;
  color: var(--accent); text-transform: uppercase;
}

/* PRODUCT GRID */
section { padding: 60px 5%; }
.section-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 50px;
  margin-bottom: 40px; color: var(--white);
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px;
}

.product-card {
  background: var(--card); border: 1px solid var(--border);
  position: relative; overflow: hidden; transition: 0.3s;
}
.product-card.hidden { display: none; }

.product-img-wrap { height: 300px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
.product-card:hover img { transform: scale(1.08); }

.product-info { padding: 20px; }
.product-brand { font-size: 10px; letter-spacing: 2px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.product-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }

/* LIGHTBOX */
.lightbox-overlay {
  position: fixed; inset: 0; z-index: 100000;
  background: rgba(5, 15, 40, 0.98); backdrop-filter: blur(15px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: 0.3s;
}
.lightbox-overlay.active { opacity: 1; pointer-events: all; }
.lightbox-inner { max-width: 800px; width: 90%; text-align: center; color: white; }
.lightbox-img { max-height: 60vh; width: 100%; object-fit: contain; margin-bottom: 20px; }

.btn-order {
  background: var(--accent); color: white; padding: 15px 40px;
  text-decoration: none; font-family: 'Syne', sans-serif; font-weight: 700;
  display: inline-block; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;
}

.reveal { opacity: 0; transform: translateY(20px); transition: 0.6s; }
.reveal.visible { opacity: 1; transform: translateY(0); }

</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="#" class="nav-logo" onclick="filterCategory('all')">C2B HUB</a>
  <div class="menu-btn" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>

<div class="side-menu" id="sideMenu">
  <p style="font-size: 10px; letter-spacing: 3px; color: var(--accent2); margin-bottom: 20px;">BROWSE ARCHIVE</p>
  <a onclick="filterCategory('all')">ALL ITEMS</a>
  <a onclick="filterCategory('sneakers')">SNEAKERS</a>
  <a onclick="filterCategory('bags')">BAGS</a>
  <a onclick="filterCategory('watches')">WATCHES</a>
  <a onclick="filterCategory('hoodies')">HOODIES</a>
  <div style="margin-top: auto; font-size: 12px; opacity: 0.5;">WHATSAPP: +86 19851957535</div>
</div>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title" id="catTitle">PREMIUM ARCHIVE</h1>
    <p style="color: var(--silver); margin-top: 20px;">Click the menu to filter by collection.</p>
  </div>
</section>

<section id="products">
  <div class="products-grid" id="mainGrid"></div>
</section>

<div class="lightbox-overlay" id="lightbox">
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
    <h2 id="lbName" style="font-family: 'Bebas Neue'; font-size: 40px;"></h2>
    <p id="lbBrand" style="letter-spacing: 3px; color: var(--accent2); text-transform: uppercase;"></p>
    <a href="https://wa.me/8619851957535" class="btn-order" target="_blank">Order via WhatsApp →</a>
    <p style="margin-top: 20px; cursor: pointer; font-size: 12px; opacity: 0.6;" onclick="closeLightbox()">[ ESC TO CLOSE ]</p>
  </div>
</div>

<script>
const products = [
  { brand: "Nike", name: "AF1 Supreme White", img: "image_1.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Supreme Black", img: "image_2.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Supreme Wheat", img: "image_3.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Blue/White Contrast", img: "image_4.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Classic White", img: "image_5.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Contrast Black/White", img: "image_6.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Classic Black", img: "image_7.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Grey Suede", img: "image_8.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Green Contrast", img: "image_9.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Panda Edition", img: "image_10.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Red Contrast", img: "image_11.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Forest Green", img: "image_12.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Carbon Grey", img: "image_13.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Baby Pink", img: "image_14.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Dark Brown", img: "image_15.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Cream Suede", img: "image_16.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Navy Blue", img: "image_17.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Deep Red", img: "image_18.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Core Black", img: "image_19.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Classic Grey", img: "image_20.jpg", cat: "sneakers" },
  { brand: "Couture", name: "Purple Orchid Heel", img: "image_21.jpg", cat: "sneakers" },
  { brand: "Couture", name: "Green Orchid Heel", img: "image_22.jpg", cat: "sneakers" },
  { brand: "Y2K Archive", name: "Star Buckle Denim Bag", img: "image_23.jpg", cat: "bags" },
  { brand: "Utility", name: "Multi-Pocket Tech Bag", img: "image_24.jpg", cat: "bags" },
  { brand: "Y2K Archive", name: "White Star Buckle Bag", img: "image_25.jpg", cat: "bags" },
  { brand: "Coquette", name: "Red Glossy Cherry Bag", img: "image_26.jpg", cat: "bags" },
  { brand: "Y2K Archive", name: "Black Star Chain Bag", img: "image_27.jpg", cat: "bags" },
  { brand: "Coquette", name: "Black Hello Kitty Bag", img: "image_28.jpg", cat: "bags" },
  { brand: "Coquette", name: "Red Pearl Bow Bag", img: "image_29.jpg", cat: "bags" }
];

const grid = document.getElementById('mainGrid');

function render(data) {
  grid.innerHTML = '';
  data.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card reveal visible';
    card.onclick = () => openLightbox(p);
    card.innerHTML = `
      <div class="product-img-wrap"><img src="${p.img}"></div>
      <div class="product-info">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
      </div>`;
    grid.appendChild(card);
  });
}

// TOGGLE HAMBURGER
function toggleMenu() {
  document.getElementById('sideMenu').classList.toggle('active');
}

// CATEGORY FILTER
function filterCategory(cat) {
  toggleMenu();
  document.getElementById('catTitle').innerText = cat === 'all' ? 'PREMIUM ARCHIVE' : cat.toUpperCase();
  if(cat === 'all') {
    render(products);
  } else {
    const filtered = products.filter(p => p.cat === cat);
    render(filtered);
  }
}

function openLightbox(p) {
  document.getElementById('lbImg').src = p.img;
  document.getElementById('lbName').innerText = p.name;
  document.getElementById('lbBrand').innerText = p.brand;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

// CURSOR
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx=0, my=0, rx=0, ry=0;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
});
function animateRing() {
  rx += (mx - rx) * 0.15; ry += (my - ry) * 0.15;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(animateRing);
}
animateRing();

render(products);
</script>
</body>
</html>
