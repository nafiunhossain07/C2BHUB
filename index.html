<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2B HUB — Premium Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --black: #f0f6ff;
  --card: #ffffff;
  --white: #0a1a3a;
  --white2: #1a3060;
  --silver: #4a6090;
  --accent: #1565c0;
  --accent2: #1e88e5;
  --border: rgba(21,101,192,0.18);
  --nav-bg: rgba(255,255,255,0.92);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--black);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  cursor: none; /* Custom Cursor implementation */
}

/* CURSOR SYSTEM */
.cursor {
  position: fixed; width: 12px; height: 12px;
  background: var(--accent); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s;
  mix-blend-mode: multiply;
}
.cursor-ring {
  position: fixed; width: 40px; height: 40px;
  border: 1.5px solid var(--accent); border-radius: 50%;
  pointer-events: none; z-index: 99998;
  transform: translate(-50%, -50%);
  opacity: 0.5;
}

/* NAVIGATION */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 0 5%; display: flex; align-items: center;
  justify-content: space-between; height: 70px;
  background: var(--nav-bg); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 20px rgba(21,101,192,0.08);
}
.nav-logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px;
  letter-spacing: 4px; color: var(--accent); text-decoration: none;
}
.nav-links { display: flex; gap: 36px; list-style: none; }
.nav-links a {
  color: var(--white2); text-decoration: none; font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  font-family: 'Syne', sans-serif; font-weight: 600;
}

/* HERO SECTION */
.hero {
  min-height: 80vh; display: flex; align-items: center;
  position: relative; padding: 100px 5% 0;
  background: linear-gradient(135deg, #e8f1ff 0%, #dceeff 100%);
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(60px, 10vw, 120px); line-height: 0.9;
  color: var(--accent); text-transform: uppercase;
}

/* PRODUCT GRID */
section { padding: 80px 5%; }
.section-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 50px;
  margin-bottom: 40px; color: var(--white);
}
.section-title em { font-style: normal; color: transparent; -webkit-text-stroke: 1.5px var(--accent); }

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px;
}

.product-card {
  background: var(--card); border: 1px solid var(--border);
  position: relative; overflow: hidden; transition: all 0.3s ease;
}
.product-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 15px 35px rgba(21,101,192,0.1); }

.product-img-wrap {
  height: 300px; background: #f8faff;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
.product-card:hover img { transform: scale(1.08); }

.product-info { padding: 20px; }
.product-brand { font-size: 10px; letter-spacing: 2px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
.product-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--white); }

/* LIGHTBOX */
.lightbox-overlay {
  position: fixed; inset: 0; z-index: 100000;
  background: rgba(5, 15, 40, 0.98); backdrop-filter: blur(15px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: 0.3s;
}
.lightbox-overlay.active { opacity: 1; pointer-events: all; }
.lightbox-inner { max-width: 800px; width: 90%; text-align: center; color: white; }
.lightbox-img { max-height: 60vh; width: 100%; object-fit: contain; margin-bottom: 20px; border-radius: 8px; }

.btn-order {
  background: var(--accent); color: white; padding: 15px 40px;
  text-decoration: none; font-family: 'Syne', sans-serif; font-weight: 700;
  display: inline-block; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;
}

/* ANIMATIONS */
.reveal { opacity: 0; transform: translateY(30px); transition: 0.6s all ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

@media (max-width: 768px) {
  .products-grid { grid-template-columns: 1fr 1fr; }
  .nav-links { display: none; }
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="#" class="nav-logo">C2B HUB</a>
  <ul class="nav-links">
    <li><a href="#products">Sneakers</a></li>
    <li><a href="#products">Campus</a></li>
    <li><a href="#products">Bags & Accessories</a></li>
  </ul>
  <div style="font-size: 12px; font-weight: bold; background: var(--accent); color: white; padding: 5px 12px; border-radius: 20px;">ORDERS: +86 19851957535</div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">ARCHIVE<br>COLLECTION</h1>
    <p style="color: var(--silver); margin-top: 20px;">Direct Sourcing from China. Premium Quality. Any Quantity.</p>
  </div>
</section>

<section id="products">
  <h2 class="section-title">FULL <em>ARCHIVE</em></h2>
  <div class="products-grid" id="mainGrid"></div>
</section>

<div class="lightbox-overlay" id="lightbox">
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
    <h2 id="lbName" style="font-family: 'Bebas Neue'; font-size: 40px;"></h2>
    <p id="lbBrand" style="letter-spacing: 3px; color: var(--accent2); text-transform: uppercase;"></p>
    <a href="https://wa.me/8619851957535" class="btn-order" target="_blank">Order via WhatsApp →</a>
    <p style="margin-top: 20px; cursor: pointer; font-size: 12px; opacity: 0.6;" onclick="closeLightbox()">[ ESC TO CLOSE ]</p>
  </div>
</div>

<script>
const products = [
  { brand: "Nike", name: "AF1 Supreme White", img: "image_1.jpg" },
  { brand: "Nike", name: "AF1 Supreme Black", img: "image_2.jpg" },
  { brand: "Nike", name: "AF1 Supreme Wheat", img: "image_3.jpg" },
  { brand: "Nike", name: "AF1 Blue/White Contrast", img: "image_4.jpg" },
  { brand: "Nike", name: "AF1 Classic White", img: "image_5.jpg" },
  { brand: "Nike", name: "AF1 Contrast Black/White", img: "image_6.jpg" },
  { brand: "Nike", name: "AF1 Classic Black", img: "image_7.jpg" },
  { brand: "Nike", name: "AF1 Grey Suede", img: "image_8.jpg" },
  { brand: "Nike", name: "AF1 Green Contrast", img: "image_9.jpg" },
  { brand: "Nike", name: "AF1 Panda Edition", img: "image_10.jpg" },
  { brand: "Nike", name: "AF1 Red Contrast", img: "image_11.jpg" },
  { brand: "Adidas", name: "Campus Forest Green", img: "image_12.jpg" },
  { brand: "Adidas", name: "Campus Carbon Grey", img: "image_13.jpg" },
  { brand: "Adidas", name: "Campus Baby Pink", img: "image_14.jpg" },
  { brand: "Adidas", name: "Campus Dark Brown", img: "image_15.jpg" },
  { brand: "Adidas", name: "Campus Cream Suede", img: "image_16.jpg" },
  { brand: "Adidas", name: "Campus Navy Blue", img: "image_17.jpg" },
  { brand: "Adidas", name: "Campus Deep Red", img: "image_18.jpg" },
  { brand: "Adidas", name: "Campus Core Black", img: "image_19.jpg" },
  { brand: "Adidas", name: "Campus Classic Grey", img: "image_20.jpg" },
  { brand: "Couture", name: "Purple Orchid 3D Heel", img: "image_21.jpg" },
  { brand: "Couture", name: "Green Orchid 3D Heel", img: "image_22.jpg" },
  { brand: "Y2K Archive", name: "Star Buckle Denim Bag", img: "image_23.jpg" },
  { brand: "Utility", name: "Multi-Pocket Tech Bag", img: "image_24.jpg" },
  { brand: "Y2K Archive", name: "White Star Buckle Bag", img: "image_25.jpg" },
  { brand: "Coquette", name: "Red Glossy Cherry Bag", img: "image_26.jpg" },
  { brand: "Y2K Archive", name: "Black Star Chain Bag", img: "image_27.jpg" },
  { brand: "Coquette", name: "Black Hello Kitty Bow Bag", img: "image_28.jpg" },
  { brand: "Coquette", name: "Red Pearl Bow Handbag", img: "image_29.jpg" }
];

const grid = document.getElementById('mainGrid');

// Dynamic Render
products.forEach((p) => {
  const card = document.createElement('div');
  card.className = 'product-card reveal';
  card.onclick = () => openLightbox(p);
  card.innerHTML = `
    <div class="product-img-wrap">
      <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x400?text=Image+JPG+Needed'">
    </div>
    <div class="product-info">
      <div class="product-brand">${p.brand}</div>
      <div class="product-name">${p.name}</div>
    </div>
  `;
  grid.appendChild(card);
});

function openLightbox(p) {
  document.getElementById('lbImg').src = p.img;
  document.getElementById('lbName').innerText = p.name;
  document.getElementById('lbBrand').innerText = p.brand;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

// Cursor Follow
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
});
function animateRing() {
  rx += (mx - rx) * 0.15; ry += (my - ry) * 0.15;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(animateRing);
}
animateRing();

// Scroll Reveal
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Keyboard ESC
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
