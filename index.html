<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2B HUB — Premium Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #1565c0; --dark: #0a1a3a; --bg: #f4f8ff; --green: #25D366; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: var(--dark); font-family: 'DM Sans', sans-serif; }
        
        /* NAV & MENU */
        nav { position:fixed; top:0; width:100%; height:70px; background:white; display:flex; align-items:center; justify-content:space-between; padding:0 5%; z-index:1000; border-bottom:2px solid var(--blue); }
        .logo { font-family:'Bebas Neue'; font-size:28px; color:var(--blue); text-decoration:none; }
        .cart-icon { position:relative; cursor:pointer; margin-right:15px; }
        .badge-count { position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:10px; padding:2px 6px; border-radius:50%; }
        
        .side-menu { position:fixed; top:0; right:-100%; width:300px; height:100vh; background:var(--dark); color:white; z-index:2000; padding:80px 30px; transition:0.4s; }
        .side-menu.active { right:0; }
        .side-menu a { color:white; display:block; font-family:'Bebas Neue'; font-size:30px; margin-bottom:15px; text-decoration:none; cursor:pointer; }
        .socials { display:flex; gap:15px; margin-top:30px; }
        .socials svg { width:25px; height:25px; fill:white; cursor:pointer; }

        /* PRODUCT GRID */
        .hero { padding:120px 5% 40px; text-align:center; background:white; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px; padding:30px 5%; }
        .card { background:white; border-radius:15px; overflow:hidden; position:relative; box-shadow:0 5px 15px rgba(0,0,0,0.05); }
        .img-wrap { width:100%; height:280px; position:relative; }
        .img-wrap img { width:100%; height:100%; object-fit:cover; }
        
        /* ADD SIGN (THE ICON) */
        .add-sign { position:absolute; bottom:15px; right:15px; background:var(--blue); color:white; width:45px; height:45px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; box-shadow:0 4px 10px rgba(21,101,192,0.4); }
        .add-sign:active { transform:scale(0.9); }

        .card-body { padding:15px; }
        .card-body p { font-size:10px; font-weight:bold; color:var(--blue); text-transform:uppercase; }
        .card-body h3 { font-size:15px; font-family:'Syne'; }

        /* CART DRAWER */
        .drawer { position:fixed; top:0; right:-100%; width:340px; height:100vh; background:white; z-index:3000; display:flex; flex-direction:column; transition:0.4s; box-shadow:-5px 0 15px rgba(0,0,0,0.1); }
        .drawer.active { right:0; }
        .d-head { padding:20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; }
        .d-body { flex:1; overflow-y:auto; padding:20px; }
        .checkout-btn { background:var(--green); color:white; padding:18px; border:none; width:100%; font-family:'Syne'; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">C2B HUB</a>
    <div style="display:flex; align-items:center;">
        <div class="cart-icon" onclick="toggleCart()">
            <svg width="24" height="24" fill="none" stroke="var(--blue)" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="badge-count" id="count">0</span>
        </div>
        <div onclick="toggleMenu()" style="cursor:pointer; font-size:24px; color:var(--blue);">☰</div>
    </div>
</nav>

<div class="side-menu" id="sideMenu">
    <div onclick="toggleMenu()" style="cursor:pointer; margin-bottom:20px;">✕ CLOSE</div>
    <a onclick="filter('all')">ALL ITEMS</a>
    <a onclick="filter('sneakers')">SNEAKERS</a>
    <a onclick="filter('bags')">BAGS</a>
    <div class="socials">
        <a href="https://www.instagram.com/c2bhub" target="_blank"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></a>
        <a href="https://www.facebook.com/share/1C6gCPDFwt/" target="_blank"><svg viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg></a>
    </div>
</div>

<div class="drawer" id="cartDrawer">
    <div class="d-head"><h3>YOUR BAG</h3><span onclick="toggleCart()" style="cursor:pointer;">✕</span></div>
    <div class="d-body" id="cartList"></div>
    <button class="checkout-btn" onclick="checkout()">CHECKOUT ON WHATSAPP</button>
</div>

<section class="hero">
    <h1 id="catTitle">PREMIUM ARCHIVE</h1>
    <p>From China to you — any product, any quantity, anytime!</p>
</section>

<div class="grid" id="grid"></div>

<script>
    let cart = [];
    const products = [
        { name: "AF1 Supreme White", brand: "Nike", img: "image_1.jpg", cat: "sneakers" },
        { name: "AF1 Supreme Black", brand: "Nike", img: "image_2.jpg", cat: "sneakers" },
        { name: "Denim Star Bag", brand: "Y2K", img: "image_23.jpg", cat: "bags" },
        { name: "Pearl Bow Handbag", brand: "Luxury", img: "image_29.jpg", cat: "bags" }
    ];

    function render(items) {
        document.getElementById('grid').innerHTML = items.map(p => `
            <div class="card">
                <div class="img-wrap">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">
                    <button class="add-sign" onclick="add('${p.name}')">
                        <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </button>
                </div>
                <div class="card-body">
                    <p>${p.brand}</p>
                    <h3>${p.name}</h3>
                </div>
            </div>
        `).join('');
    }

    function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
    function toggleCart() { document.getElementById('cartDrawer').classList.toggle('active'); }

    function add(name) {
        cart.push(products.find(x => x.name === name));
        document.getElementById('count').innerText = cart.length;
        updateCart();
        toggleCart(); // Auto-open cart to show success
    }

    function updateCart() {
        document.getElementById('cartList').innerHTML = cart.map((p, i) => `
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <img src="${p.img}" style="width:50px; height:50px; border-radius:5px; object-fit:cover;">
                <div style="flex:1"><b>${p.name}</b></div>
                <span onclick="remove(${i})" style="color:red; cursor:pointer;">✕</span>
            </div>
        `).join('');
    }

    function remove(i) {
        cart.splice(i, 1);
        document.getElementById('count').innerText = cart.length;
        updateCart();
    }

    function checkout() {
        if(!cart.length) return alert("Bag is empty");
        let msg = "Hello C2B HUB, I want to order:\n" + cart.map(p => `- ${p.name}`).join('\n');
        window.open(`https://wa.me/8619851957535?text=${encodeURIComponent(msg)}`);
    }

    function filter(c) {
        toggleMenu();
        document.getElementById('catTitle').innerText = c === 'all' ? 'PREMIUM ARCHIVE' : c.toUpperCase();
        render(c === 'all' ? products : products.filter(x => x.cat === c));
    }

    render(products);
</script>
</body>
</html>
