<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2B HUB — Premium Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
  --black: #f0f6ff;
  --card: #ffffff;
  --white: #0a1a3a;
  --white2: #1a3060;
  --silver: #4a6090;
  --accent: #1565c0;
  --accent2: #1e88e5;
  --border: rgba(21,101,192,0.18);
  --nav-bg: rgba(255,255,255,0.92);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--black);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* NAVIGATION */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 0 5%; display: flex; align-items: center;
  justify-content: space-between; height: 70px;
  background: var(--nav-bg); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px;
  letter-spacing: 4px; color: var(--accent); text-decoration: none;
}

.nav-right { display: flex; align-items: center; gap: 20px; }

.cart-icon-wrap {
  position: relative; cursor: pointer; font-size: 20px; color: var(--accent);
}
#cart-count {
  position: absolute; top: -8px; right: -10px;
  background: var(--accent); color: white;
  font-size: 10px; padding: 2px 6px; border-radius: 50%;
}

/* HAMBURGER */
.menu-btn { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.menu-btn span { width: 25px; height: 2px; background: var(--accent); }

/* SIDE MENU */
.side-menu {
  position: fixed; top: 0; right: -100%; width: 320px; height: 100vh;
  background: var(--white); color: white; z-index: 1050;
  display: flex; flex-direction: column; padding: 80px 40px;
  transition: 0.5s cubic-bezier(0.77,0.2,0.05,1.0);
}
.side-menu.active { right: 0; }
.side-menu a {
  color: #fff; text-decoration: none; font-family: 'Bebas Neue';
  font-size: 32px; margin-bottom: 15px; cursor: pointer; transition: 0.3s;
}
.side-menu a:hover { color: var(--accent2); }

/* SOCIAL ICONS */
.social-links { margin-top: 30px; display: flex; gap: 20px; }
.social-links a { font-size: 24px; color: white; transition: 0.3s; }
.social-links a:hover { color: var(--accent2); transform: translateY(-3px); }

/* HERO */
.hero {
  min-height: 50vh; display: flex; align-items: center;
  padding: 100px 5% 40px;
  background: linear-gradient(135deg, #e8f1ff 0%, #dceeff 100%);
}
.hero-title { font-family: 'Bebas Neue'; font-size: clamp(50px, 8vw, 100px); color: var(--accent); }

/* PRODUCT GRID */
.products-grid {
  display: grid; padding: 40px 5%;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px;
}
.product-card {
  background: var(--card); border: 1px solid var(--border);
  overflow: hidden; transition: 0.3s; border-radius: 4px;
}
.product-img-wrap { height: 280px; background: #f8faff; position: relative; }
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

.add-to-cart-overlay {
  position: absolute; inset: 0; background: rgba(10, 26, 58, 0.4);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: 0.3s;
}
.product-card:hover .add-to-cart-overlay { opacity: 1; }
.btn-add {
  background: var(--accent); color: white; border: none;
  padding: 12px 20px; font-family: 'Syne'; font-weight: 700;
  cursor: pointer; font-size: 12px;
}

.product-info { padding: 15px; }
.product-brand { font-size: 10px; letter-spacing: 2px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.product-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }

/* CART SLIDE OUT */
.cart-drawer {
  position: fixed; top: 0; right: -100%; width: 350px; height: 100vh;
  background: white; z-index: 2000; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
  display: flex; flex-direction: column; transition: 0.5s;
}
.cart-drawer.active { right: 0; }
.cart-header { padding: 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.cart-items { flex: 1; overflow-y: auto; padding: 20px; }
.cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
.cart-item img { width: 60px; height: 60px; object-fit: cover; }
.cart-footer { padding: 25px; background: #f8faff; }
.btn-checkout {
  width: 100%; background: #25d366; color: white; border: none;
  padding: 15px; font-family: 'Syne'; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

@media (max-width: 768px) {
  .cart-drawer { width: 100%; }
}
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">C2B HUB</a>
  <div class="nav-right">
    <div class="cart-icon-wrap" onclick="toggleCart()">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cart-count">0</span>
    </div>
    <div class="menu-btn" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<div class="side-menu" id="sideMenu">
  <a onclick="filterCategory('all')">ALL COLLECTIONS</a>
  <a onclick="filterCategory('sneakers')">SNEAKERS</a>
  <a onclick="filterCategory('bags')">BAGS</a>
  <a onclick="filterCategory('watches')">WATCHES</a>
  <a onclick="filterCategory('hoodies')">HOODIES</a>
  
  <div class="social-links">
    <a href="https://www.instagram.com/c2bhub?igsh=ZmR1cmlmbmxkY2tx" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://www.facebook.com/share/1C6gCPDFwt/?mibextid=wwXIfr" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
    <a title="WeChat: Aftab_19851957535"><i class="fa-brands fa-weixin"></i></a>
  </div>
  <p style="margin-top: 20px; font-size: 12px; color: var(--accent2);">+86 19851957535</p>
</div>

<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3 style="font-family: 'Syne';">YOUR SELECTION</h3>
    <i class="fa-solid fa-xmark" onclick="toggleCart()" style="cursor:pointer;"></i>
  </div>
  <div class="cart-items" id="cartItemsList">
    </div>
  <div class="cart-footer">
    <button class="btn-checkout" onclick="checkoutWhatsApp()">
      <i class="fa-brands fa-whatsapp"></i> CHECKOUT ON WHATSAPP
    </button>
  </div>
</div>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title" id="catTitle">PREMIUM ARCHIVE</h1>
    <p style="color: var(--silver); margin-top: 20px; font-weight: 500;">
      From China to you — any product, any quantity, anytime!
    </p>
  </div>
</section>

<div class="products-grid" id="mainGrid"></div>

<script>
let cart = [];

const products = [
  { brand: "Nike", name: "AF1 Supreme White", img: "image_1.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Supreme Black", img: "image_2.jpg", cat: "sneakers" },
  { brand: "Nike", name: "AF1 Supreme Wheat", img: "image_3.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Forest Green", img: "image_12.jpg", cat: "sneakers" },
  { brand: "Adidas", name: "Campus Carbon Grey", img: "image_13.jpg", cat: "sneakers" },
  { brand: "Y2K Archive", name: "Star Buckle Denim Bag", img: "image_23.jpg", cat: "bags" },
  { brand: "Utility", name: "Multi-Pocket Tech Bag", img: "image_24.jpg", cat: "bags" },
  { brand: "Luxury", name: "Red Glossy Cherry Bag", img: "image_26.jpg", cat: "bags" }
  // Note: Add more items following this pattern
];

function render(data) {
  const grid = document.getElementById('mainGrid');
  grid.innerHTML = '';
  data.forEach((p, index) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-img-wrap">
        <img src="${p.img}">
        <div class="add-to-cart-overlay">
          <button class="btn-add" onclick="addToCart('${p.name}')">ADD TO CART</button>
        </div>
      </div>
      <div class="product-info">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function addToCart(name) {
  const item = products.find(p => p.name === name);
  cart.push(item);
  updateCartUI();
  // Optional: Auto open cart to show it was added
  document.getElementById('cartDrawer').classList.add('active');
}

function updateCartUI() {
  const list = document.getElementById('cartItemsList');
  const count = document.getElementById('cart-count');
  count.innerText = cart.length;
  list.innerHTML = '';
  
  cart.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <img src="${item.img}">
      <div style="flex:1">
        <div style="font-weight:700; font-size:12px;">${item.name}</div>
        <div style="font-size:10px; color:gray;">${item.brand}</div>
      </div>
      <i class="fa-solid fa-trash" onclick="removeFromCart(${index})" style="font-size:12px; cursor:pointer; color:#c62828;"></i>
    `;
    list.appendChild(div);
  });
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCartUI();
}

function toggleCart() { document.getElementById('cartDrawer').classList.toggle('active'); }
function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }

function checkoutWhatsApp() {
  if (cart.length === 0) return alert("Your cart is empty!");
  
  let message = "Hello C2B HUB, I would like to order the following items:\n\n";
  cart.forEach((item, idx) => {
    message += `${idx + 1}. ${item.brand} - ${item.name}\n`;
  });
  message += "\nPlease confirm availability and total price.";
  
  const encodedMsg = encodeURIComponent(message);
  window.open(`https://wa.me/8619851957535?text=${encodedMsg}`, '_blank');
}

function filterCategory(cat) {
  toggleMenu();
  document.getElementById('catTitle').innerText = cat === 'all' ? 'PREMIUM ARCHIVE' : cat.toUpperCase();
  const filtered = cat === 'all' ? products : products.filter(p => p.cat === cat);
  render(filtered);
}

// Init
render(products);
</script>
</body>
</html>
