<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2B HUB — From China To You</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
:root { --blue:#1565c0; --dark:#0a1a3a; --bg:#f4f8ff; --green:#25D366; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--dark); font-family:'DM Sans',sans-serif; overflow-x:hidden; }

nav { position:fixed; top:0; width:100%; height:70px; background:white; display:flex; align-items:center; justify-content:space-between; padding:0 5%; z-index:1000; border-bottom:2px solid var(--blue); }
.logo { font-family:'Bebas Neue'; font-size:28px; color:var(--blue); text-decoration:none; letter-spacing:2px; }

.nav-icons { display:flex; align-items:center; gap:20px; }
.cart-btn { position:relative; cursor:pointer; font-size:24px; }
.count-badge { position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:10px; padding:2px 6px; border-radius:50%; font-weight:bold; }

.sidebar { position:fixed; top:0; right:-100%; width:300px; height:100vh; background:var(--dark); color:white; z-index:2000; padding:80px 30px; transition:0.4s; }
.sidebar.active { right:0; }
.sidebar a { color:white; display:block; font-family:'Bebas Neue'; font-size:32px; margin-bottom:15px; text-decoration:none; cursor:pointer; }
.sidebar a:hover { color:var(--blue); }

.social-box { display:flex; gap:15px; margin-top:40px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px; }
.social-box a { font-size:16px; font-family:'DM Sans'; margin-bottom:0; }

.hero { padding:130px 5% 50px; text-align:center; background:white; border-radius:0 0 30px 30px; }
.hero h1 { font-family:'Bebas Neue'; font-size:clamp(40px,8vw,70px); color:var(--blue); margin-bottom:10px; }
.hero p { font-weight:500; color:#556b8d; font-size:18px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:25px; padding:40px 5%; }
.card { background:white; border-radius:15px; overflow:hidden; position:relative; box-shadow:0 10px 20px rgba(0,0,0,0.05); transition:0.3s; }
.card:hover { transform:translateY(-5px); }

.img-area { width:100%; height:300px; position:relative; background:#eee; }
.img-area img { width:100%; height:100%; object-fit:cover; display:block; }

.add-btn {
    position:absolute;
    bottom:15px;
    right:15px;
    background:var(--blue);
    color:white;
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:none;
    box-shadow:0 4px 12px rgba(21,101,192,0.4);
    z-index:50;
}
.add-btn svg { width:24px; height:24px; fill:white; }

.card-details { padding:15px; }
.card-details span { font-size:10px; font-weight:bold; color:var(--blue); text-transform:uppercase; letter-spacing:1px; }
.card-details h3 { font-size:16px; font-family:'Syne'; margin-top:5px; }

.cart-drawer { position:fixed; top:0; right:-100%; width:350px; height:100vh; background:white; z-index:3000; display:flex; flex-direction:column; transition:0.5s; box-shadow:-10px 0 30px rgba(0,0,0,0.1); }
.cart-drawer.active { right:0; }
.cart-top { padding:25px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
.cart-list { flex:1; overflow-y:auto; padding:20px; }
.cart-item { display:flex; align-items:center; gap:12px; margin-bottom:15px; padding:10px; background:#f8faff; border-radius:10px; }
.cart-item img { width:55px; height:55px; border-radius:6px; object-fit:cover; }

.checkout-bar { padding:25px; border-top:1px solid #eee; }
.wa-btn { background:var(--green); color:white; width:100%; padding:18px; border:none; border-radius:12px; font-family:'Syne'; font-weight:bold; font-size:16px; cursor:pointer; }

@media (max-width:500px) { .cart-drawer { width:100%; } }
</style>
</head>

<body>

<nav>
    <a href="#" class="logo">C2B HUB</a>
    <div class="nav-icons">
        <div class="cart-btn" onclick="toggleCart()">🛒<span class="count-badge" id="cartCount">0</span></div>
        <div onclick="toggleMenu()" style="cursor:pointer; font-size:28px; color:var(--blue);">☰</div>
    </div>
</nav>

<div class="sidebar" id="sidebar">
    <div onclick="toggleMenu()" style="cursor:pointer; margin-bottom:30px; text-align:right;">✕ CLOSE</div>
    <a onclick="filter('all')">ALL COLLECTIONS</a>
    <a onclick="filter('sneakers')">SNEAKERS</a>
    <a onclick="filter('hoodies')">HOODIES</a>
    <a onclick="filter('bags')">BAGS</a>
    <a onclick="filter('watches')">WATCHES</a>

    <div class="social-box">
        <a href="https://www.instagram.com/c2bhub" target="_blank">Instagram</a>
        <a href="https://www.facebook.com/share/1C6gCPDFwt/" target="_blank">Facebook</a>
    </div>

    <p style="margin-top:20px; font-size:14px; opacity:0.7;">+86 19851957535</p>
</div>

<div class="cart-drawer" id="cartDrawer">
    <div class="cart-top">
        <h3>SHOPPING BAG</h3>
        <span onclick="toggleCart()" style="cursor:pointer; font-weight:bold;">✕</span>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="checkout-bar">
        <button class="wa-btn" onclick="checkout()">CONFIRM ON WHATSAPP</button>
    </div>
</div>

<section class="hero">
    <h1 id="pageTitle">PREMIUM ARCHIVE</h1>
    <p>From China to you — any product, any quantity, anytime!</p>
</section>

<div class="grid" id="productGrid"></div>

<script>
let cart = [];

const products = [
    { name: "Gold Adidas F50", brand: "Adidas", img: "gold-f50.jpg", cat: "sneakers" },
    { name: "Blue Adidas F50", brand: "Adidas", img: "blue-f50.jpg", cat: "sneakers" },
    { name: "Pink Adidas F50", brand: "Adidas", img: "pink-adidas-f50.jpg", cat: "sneakers" },
    { name: "Purple Adidas F50", brand: "Adidas", img: "purple-f50.jpg", cat: "sneakers" },
    { name: "Black Adidas F50 Special Edition", brand: "Adidas", img: "black-f50-poster.jpg", cat: "sneakers" },
    { name: "White Blue Adidas F50", brand: "Adidas", img: "white-blue-f50.jpg", cat: "sneakers" },
    { name: "Red White Adidas F50", brand: "Adidas", img: "red-white-f50.jpg", cat: "sneakers" },
    { name: "Hot Pink Adidas F50", brand: "Adidas", img: "hot-pink-f50.jpg", cat: "sneakers" },

    { name: "White Flower Heel", brand: "C2B HUB", img: "white-flower-heel.jpg", cat: "sneakers" },
    { name: "Pink Flower Heel", brand: "C2B HUB", img: "pink-flower-heel.jpg", cat: "sneakers" },
    { name: "Purple Flower Heel", brand: "C2B HUB", img: "purple-flower-heel.jpg", cat: "sneakers" },
    { name: "White Orchid Heel", brand: "C2B HUB", img: "white-orchid-heel.jpg", cat: "sneakers" },

    { name: "UPF50+ Summer Jacket Black Mint", brand: "C2B HUB", img: "summer-jacket-black-mint.jpg", cat: "hoodies" },
    { name: "UPF50+ Summer Jacket Outdoor", brand: "C2B HUB", img: "summer-jacket-outdoor.jpg", cat: "hoodies" },
    { name: "UPF50+ Summer Jacket Sports", brand: "C2B HUB", img: "summer-jacket-sports.jpg", cat: "hoodies" },
    { name: "UPF50+ Summer Jacket Fabric Detail", brand: "C2B HUB", img: "summer-jacket-fabric.jpg", cat: "hoodies" },
    { name: "UPF50+ Summer Jacket White", brand: "C2B HUB", img: "summer-jacket-white.jpg", cat: "hoodies" },
    { name: "UPF50+ Summer Jacket Navy Blue", brand: "C2B HUB", img: "summer-jacket-navy-blue.jpg", cat: "hoodies" },
    { name: "UPF50+ Summer Jacket Color Chart", brand: "C2B HUB", img: "summer-jacket-colors.jpg", cat: "hoodies" }
];

function render(items) {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = items.map(p => `
        <div class="card">
            <div class="img-area">
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/400x400?text=${encodeURIComponent(p.name)}'">
                <button class="add-btn" type="button" onclick="addToCart('${p.name}')">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
            </div>
            <div class="card-details">
                <span>${p.brand}</span>
                <h3>${p.name}</h3>
            </div>
        </div>
    `).join('');
}

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('active');
}

function toggleCart() {
    document.getElementById('cartDrawer').classList.toggle('active');
}

function addToCart(name) {
    const p = products.find(x => x.name === name);
    cart.push(p);
    document.getElementById('cartCount').innerText = cart.length;
    updateCartList();
    document.getElementById('cartDrawer').classList.add('active');
}

function updateCartList() {
    const list = document.getElementById('cartList');

    if (cart.length === 0) {
        list.innerHTML = "<p>Your bag is empty.</p>";
        return;
    }

    list.innerHTML = cart.map((p, i) => `
        <div class="cart-item">
            <img src="${p.img}" onerror="this.src='https://via.placeholder.com/60'">
            <div style="flex:1"><b>${p.name}</b></div>
            <span onclick="removeItem(${i})" style="color:red; cursor:pointer; font-weight:bold; font-size:18px;">×</span>
        </div>
    `).join('');
}

function removeItem(i) {
    cart.splice(i, 1);
    document.getElementById('cartCount').innerText = cart.length;
    updateCartList();
}

function checkout() {
    if (!cart.length) {
        alert("Your bag is empty!");
        return;
    }

    let text = "Hello C2B HUB, I'd like to order:\n\n" +
        cart.map((p, i) => `${i + 1}. ${p.brand} - ${p.name}`).join('\n');

    window.open(`https://wa.me/8619851957535?text=${encodeURIComponent(text)}`);
}

function filter(c) {
    toggleMenu();
    document.getElementById('pageTitle').innerText = c === 'all' ? 'PREMIUM ARCHIVE' : c.toUpperCase();
    render(c === 'all' ? products : products.filter(x => x.cat === c));
}

render(products);
</script>

</body>
</html>
